name: Pull request checks

on:
  pull_request:
    branches: [master, release/staging]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  NEXT_TELEMETRY_DISABLED: '1'

defaults:
  run:
    shell: bash

jobs:
  conventions:
    name: PR conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.metadata.outputs.backend }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate the source branch, title and PR commits
        id: metadata
        run: node scripts/ci/check-pull-request.mjs

  app:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Disposable Supabase checks
    if: ${{ always() && needs.conventions.outputs.backend == 'true' }}
    needs: conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run test:deno
      - name: Typecheck Edge Functions
        run: npm exec -- deno check supabase/functions/vtv-dictionary/index.ts supabase/functions/quiz-submit/index.ts
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: '3.2.0'
      - name: Apply migrations and check Dictionary SQL and HTTP
        run: |
          trap 'supabase stop --no-backup' EXIT
          umask 077
          printf 'ADMIN_JWT_SECRET=%s\nVTV_ALLOWED_ORIGINS=http://127.0.0.1:3000\n' \
            "$(openssl rand -hex 32)" > supabase/functions/.env
          supabase start >/dev/null
          for suite in preview-limit import editorial rights-review collisions publication configuration bulk management; do
            echo "Checking $suite.sql"
            docker exec -i supabase_db_4snow psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < "tests/supabase/$suite.sql"
          done
          npm run supabase:local:cors
          npm run test:vtv:local:http
          node tests/vua-tieng-viet/rights-local.integration.mjs
      - name: Check Quiz SQL, HTTP and Realtime
        env:
          SUPABASE_CLI: supabase
        run: |
          workdir=output/quiz-verification
          mkdir -p "$workdir/supabase"
          cp -R supabase/migrations supabase/functions "$workdir/supabase/"
          cp -R lib "$workdir/"
          python3 - "$workdir" <<'PYTHON'
          import json
          from pathlib import Path
          import sys
          import tomllib

          config = tomllib.loads(Path("supabase/config.toml").read_text(encoding="utf-8"))
          config["project_id"] = "quiz-verification"
          config.setdefault("api", {})["port"] = 55321
          config.setdefault("db", {})["port"] = 55322
          (Path(sys.argv[1]) / "supabase/config.jsonc").write_text(json.dumps(config), encoding="utf-8")
          PYTHON
          trap 'supabase stop --workdir output/quiz-verification --no-backup' EXIT
          supabase start --workdir "$workdir" >/dev/null
          node tests/quiz/local-integrity.integration.mjs

  gate:
    name: PR gate
    if: ${{ always() }}
    needs: [conventions, app, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every applicable check to pass
        env:
          CONVENTIONS_RESULT: ${{ needs.conventions.result }}
          APP_RESULT: ${{ needs.app.result }}
          BACKEND_REQUIRED: ${{ needs.conventions.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          printf 'Conventions: %s\nApp: %s\nBackend required: %s\nBackend: %s\n' \
            "$CONVENTIONS_RESULT" "$APP_RESULT" "$BACKEND_REQUIRED" "$BACKEND_RESULT"
          [[ "$CONVENTIONS_RESULT" == success && "$APP_RESULT" == success ]]
          case "$BACKEND_REQUIRED" in
            true)  [[ "$BACKEND_RESULT" == success ]] ;;
            false) [[ "$BACKEND_RESULT" == skipped ]] ;;
            *)     exit 1 ;;
          esac
